<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#15181a; --muted:#6c7471; --line:#dfe2dd;
  --accent:#1f6f5c; --accent-soft:rgba(31,111,92,.16); --on-accent:#ffffff; --warn:#b4492d;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1213; --surface:#171b1c; --ink:#eef1ee; --muted:#8f9894; --line:#262c2d;
    --accent:#5fc4a5; --accent-soft:rgba(95,196,165,.18); --on-accent:#0f1213; --warn:#e0806a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1213; --surface:#171b1c; --ink:#eef1ee; --muted:#8f9894; --line:#262c2d;
  --accent:#5fc4a5; --accent-soft:rgba(95,196,165,.18); --on-accent:#0f1213; --warn:#e0806a;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.4; min-height:100vh;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#app{max-width:520px;margin:0 auto;padding:18px 20px 110px}

.top{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:14px;min-height:20px}
.money{font-size:56px;font-weight:300;letter-spacing:-.03em;line-height:1.05;margin-top:10px;font-variant-numeric:tabular-nums}
.ips{color:var(--muted);font-size:16px;font-variant-numeric:tabular-nums;margin-top:2px}

/* satisfaction + news */
.sat{margin-top:14px}
.satl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.satb{height:6px;border-radius:6px;background:var(--line);margin-top:6px;overflow:hidden}
.satb i{display:block;height:100%;width:0;border-radius:6px;background:var(--muted);transition:width .3s ease,background .3s}
.satb i.hi{background:var(--accent)}
.satb i.lo{background:var(--warn)}
.news{margin-top:10px;font-size:13px;color:var(--muted);min-height:18px}
.news.up{color:var(--warn)}
.news.down{color:var(--accent)}

/* orders */
.ohd{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.ohd h2{font-size:18px;font-weight:500;margin:0}
.ghost{
  padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;
  font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;
}
.ghost:disabled{color:var(--muted);cursor:default}
.ghost.on{border-color:var(--accent);color:var(--accent)}
.ocard{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:10px}
.ocard.empty{background:transparent;border-style:dashed;color:var(--muted);text-align:center;padding:20px 14px;font-size:14px}
.ocard.ready{border-color:var(--accent)}
.oh{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.orew{font-variant-numeric:tabular-nums;color:var(--accent);text-align:right}
.oline{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin-top:6px}
.oline .ost{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.oline .ost.bad{color:var(--warn)}
.oline .ost.ok{color:var(--accent)}
.obar{height:3px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.obar i{display:block;height:100%;background:var(--ink);width:100%}
.ocard.ready .obar i{background:var(--accent)}
.ofoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;min-height:20px}
.ofoot .onote{color:var(--muted);font-size:12px;flex:1;text-align:right}
.skip{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats .l{font-size:13px;color:var(--muted)}
.stats .v{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}

.panel{display:none}
.panel.on{display:block}
.note{color:var(--muted);font-size:14px;margin:18px 0 4px;max-width:46ch}
.h{font-size:14px;color:var(--muted);margin:26px 0 2px;font-weight:500}
.gnote{color:var(--muted);font-size:14px;margin:0 0 4px;max-width:46ch}
.gnote.up{color:var(--warn)}
.gnote.down{color:var(--accent)}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.row .info{flex:1;min-width:0}
.row .name{font-weight:500;font-size:16px}
.row .name .cnt{color:var(--accent);margin-left:8px;font-variant-numeric:tabular-nums}
.row .sub{color:var(--muted);font-size:14px;margin-top:2px}
.sbar{height:3px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden;max-width:220px}
.sbar i{display:block;height:100%;background:var(--accent);width:0}
.tog{background:none;border:0;padding:0;margin-top:6px;color:var(--muted);font-size:13px;text-decoration:underline;text-align:left}
.row:has(.pbox){flex-wrap:wrap}
.row:has(.pbox) .info{flex:1 1 130px}
.pbox{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 1 180px;max-width:100%;min-width:0}
.pbox input{
  width:92px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  font:inherit;font-variant-numeric:tabular-nums;text-align:right
}
.pbox small{font-size:12px;color:var(--muted);text-align:right;max-width:100%;overflow-wrap:anywhere}
.buy{
  min-width:96px;padding:10px 12px;border-radius:10px;border:1px solid var(--ink);
  background:var(--ink);color:var(--bg);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;
}
.buy:disabled{background:transparent;border-color:var(--line);color:var(--muted);cursor:default}
.buy.owned{border-color:transparent;color:var(--accent)}
.buy.sm{min-width:0;padding:7px 12px;font-size:14px}
.row.locked .name{color:var(--muted)}
.row.cl{margin-left:14px;border-left:2px solid var(--line);padding-left:12px}
.row.sel{background:var(--accent-soft);border-radius:10px;padding-left:10px;padding-right:10px}
.row.pick{cursor:pointer}
.cand{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:4px}
.cand span{color:var(--muted);font-size:14px}
.cand .buy{align-self:flex-start;margin-top:6px}
.erow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:15px}
.eacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.eacts .ghost{padding:7px 12px;font-size:13px}
.big{
  width:100%;margin-top:18px;padding:15px;border-radius:12px;border:1px solid var(--accent);
  background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;
}
.big:disabled{background:transparent;border-color:var(--line);color:var(--muted);cursor:default}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;margin-top:34px;padding:0}
.summary{display:flex;gap:28px;margin-top:20px}
.summary b{display:block;font-size:30px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.summary span{color:var(--muted);font-size:14px}

/* clock and calendar */
.clock{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:14px;font-variant-numeric:tabular-nums}
.clock .open{color:var(--accent)}
.clock .shut{color:var(--warn)}
.today{margin-top:4px;font-size:13px;color:var(--muted);min-height:18px}
.chead{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.chead b{font-weight:500;font-size:16px}
.chead button{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 14px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cgrid .wd{font-size:12px;color:var(--muted);text-align:center}
.cday{
  min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 0;font-variant-numeric:tabular-nums;
}
.cday .n{font-size:14px}
.cday .mk{font-size:11px;color:var(--accent);height:12px;line-height:12px}
.cday.past{color:var(--muted)}
.cday.today{background:var(--accent-soft);border-color:var(--accent)}
.cday.sel{box-shadow:0 0 0 2px var(--ink)}
.hstrip{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;align-items:end;height:70px;margin-top:12px}
.hstrip i{display:block;background:var(--line);border-radius:2px 2px 0 0;min-height:2px}
.hstrip i.open{background:var(--accent)}
.hstrip i.now{outline:2px solid var(--ink)}
.hlab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:4px 0 8px}
.hrow{display:grid;grid-template-columns:44px 1fr 1fr 56px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hrow select{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.hrow .sp{text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

/* skill trees */
.tlabels{display:grid;column-gap:10px;margin-top:10px;font-size:12px;color:var(--muted);text-align:center}
.tgrid{position:relative;display:grid;column-gap:10px;row-gap:30px;margin-top:10px}
.tlines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.tlines path{fill:none;stroke:var(--line);stroke-width:2}
.tlines path.on{stroke:var(--accent)}
.tile{
  position:relative;z-index:1;min-height:72px;padding:8px 4px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
}
.tile .tn{font-size:13px;font-weight:500;line-height:1.2}
.tile .ts{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tgrid.c4 .tile .tn{font-size:12px}
.tgrid.c4 .tile .ts{font-size:11px}
.tile.locked{border-style:dashed;background:transparent;color:var(--muted)}
.tile.can{border-color:var(--ink)}
.tile.part{border-color:var(--accent)}
.tile.owned{border-color:var(--accent);background:var(--accent-soft)}
.tile.owned .ts{color:var(--accent)}
.tile.sel{box-shadow:0 0 0 2px var(--accent)}
.tdetail{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px;margin-top:18px}
.tdn{font-weight:600;font-size:16px}
.tdd{color:var(--muted);font-size:14px;margin-top:4px}
.tdm{font-size:14px;margin-top:8px;font-variant-numeric:tabular-nums}
.tdetail .big{margin-top:12px;padding:12px}

nav{
  position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5;
}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav button{position:relative;background:none;border:0;padding:10px 0;font-size:12px;color:var(--muted)}
nav button.on{color:var(--ink);font-weight:600}
nav button.on::after{content:"";position:absolute;left:30%;right:30%;bottom:2px;height:2px;background:var(--accent);border-radius:2px}
nav .dot{position:absolute;top:7px;right:20%;width:7px;height:7px;border-radius:50%;background:var(--accent);display:none}

#toast{
  position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:88vw;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;text-align:center
}
#toast.on{opacity:1;transform:translate(-50%,0)}
#ov{position:fixed;inset:0;background:rgba(10,12,12,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:30;overflow:auto}
#ov.on{display:flex}
.card{background:var(--surface);border-radius:18px;padding:24px;max-width:420px;width:100%;margin:auto}
.card h2{margin:0 0 6px;font-size:22px;font-weight:500;letter-spacing:-.01em}
.card p{margin:0 0 16px;color:var(--muted);font-size:15px}
.kits{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kit{
  text-align:left;background:transparent;border:1px solid var(--line);border-radius:12px;padding:12px;
  display:flex;flex-direction:column;gap:4px;min-height:72px
}
.kit b{font-weight:600;font-size:15px}
.kit span{color:var(--muted);font-size:13px;line-height:1.3}
.kit.sel{border-color:var(--accent);background:var(--accent-soft)}
@media (prefers-reduced-motion: reduce){
  #toast,.satb i{transition:none}
}
.pbox input:disabled{opacity:.55}
.row .name{overflow-wrap:anywhere}

/* ---------- pixel scene ---------- */
.pxwrap{margin-top:12px}
.pxstage{position:relative;margin:0 auto;border:2px solid var(--ink);background:#000;line-height:0;overflow:hidden;--z:2.2}
.pxstage canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}
#pxov{position:absolute;inset:0;pointer-events:none;line-height:1.1;font-family:"Pixelify Sans","Hanken Grotesk",system-ui,sans-serif}
#pxov canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.pb{position:absolute;pointer-events:auto;transform:translate(-50%,-100%);margin-top:-9px;width:calc(var(--z) * 27px);
  background:#fffaf0;color:#3b2414;border:2px solid #3b2414;box-shadow:0 2px 0 #3b2414;padding:4px 2px 3px;text-align:center;
  cursor:pointer;font-size:max(9px,calc(var(--z) * 4px));font-weight:600;touch-action:manipulation}
.pbn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.pbi{display:flex;justify-content:center;gap:3px;align-items:flex-end}
.pbg{flex:0 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;max-width:32%}
.pbg canvas{display:block;max-width:100%;height:auto}
.pbs{display:block;width:100%;height:3px;background:#d8c8a0}
.pbg.done .pbs{background:#4f9a3a}
.pbg.mix .pbs{background:linear-gradient(90deg,#e0a020 var(--p,0%),#d8c8a0 var(--p,0%))}
.pbg.out .pbs{background:#c0402a}
.pbg.out canvas{filter:grayscale(1) opacity(.6)}
.pbr{align-items:center;justify-content:center;gap:4px;padding:2px 0}
.pbr canvas{display:block}
.pbv{font-size:max(10px,calc(var(--z) * 4.6px));color:#7a4a00}
.pbp{height:4px;background:#d8c8a0;margin-top:3px}
.pbp i{display:block;height:100%;width:100%;background:#4f9a3a}
.pbx{position:absolute;top:-10px;right:-8px;width:20px;height:20px;padding:0;line-height:16px;font-size:14px;background:#fffaf0;
  border:2px solid #3b2414;color:#3b2414;font-family:inherit}
.pbt{position:absolute;left:50%;bottom:-11px;width:14px;height:9px;margin-left:-7px;background:#3b2414;clip-path:polygon(0 0,100% 0,50% 100%)}
.pbt::after{content:"";position:absolute;left:3px;right:3px;top:0;bottom:3px;background:#fffaf0;clip-path:polygon(0 0,100% 0,50% 100%)}
.pb.rdy{background:#fff0bd;border-color:#7a4a00;box-shadow:0 2px 0 #7a4a00;animation:pbj .8s steps(2) infinite}
.pb.rdy .pbt{background:#7a4a00}.pb.rdy .pbt::after{background:#fff0bd}
@keyframes pbj{50%{margin-top:-13px}}
.pxf{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:15px;color:#fff;white-space:nowrap;pointer-events:none;
  text-shadow:2px 0 #3b2414,-2px 0 #3b2414,0 2px #3b2414,0 -2px #3b2414;animation:pxf 1.2s steps(8) forwards}
.pxf.gold{color:#ffe27a;font-size:17px}.pxf.red{color:#ff9a86}
@keyframes pxf{to{transform:translate(-50%,-50%) translateY(-40px);opacity:0}}
.pxdlg{display:flex;gap:10px;margin-top:10px;background:#f6e7c1;color:#3b2414;border:3px solid #6a4020;box-shadow:0 3px 0 #3b2414;padding:10px;cursor:pointer;
  font-family:"Pixelify Sans","Hanken Grotesk",system-ui,sans-serif}
.pxdlg[hidden]{display:none}
.pxpor{flex:none;width:60px;height:84px;background:#b9824a;border:3px solid #3b2414;display:flex;align-items:center;justify-content:center}
.pxpor canvas{width:48px;height:72px;image-rendering:pixelated;image-rendering:crisp-edges}
.pxb{flex:1;min-width:0}
.pxn{font-weight:700;font-size:17px}
.pxt{font-size:16px;line-height:1.3;min-height:5.2em;margin-top:2px}
.pxf2{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
#pxnext{width:14px;height:10px;background:#3b2414;clip-path:polygon(0 0,100% 0,50% 100%);animation:pxblink 1s steps(2) infinite}
@keyframes pxblink{50%{opacity:.2}}
#pxskip{background:transparent;border:2px solid #6a4020;color:#7a5834;padding:4px 10px;font-size:14px;min-height:32px;font-family:inherit}
.pxbar{display:flex;gap:8px;margin-top:10px}
.pxhide{display:none}
nav button.pxpulse{animation:pxnav .9s steps(2) infinite}
@keyframes pxnav{50%{color:var(--accent);transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){
  .pb.rdy,.pxf,#pxnext,nav button.pxpulse{animation:none}
}

/* ---------- pixel skin: menus, panels and controls match the scene ---------- */
:root{
  --bg:#e3cb98; --surface:#f6e7c1; --ink:#3b2414; --muted:#7a5834; --line:#c9a96e;
  --accent:#3f7a2e; --accent-soft:rgba(63,122,46,.18); --on-accent:#ffffff; --warn:#a8402a;
  --edge:#6a4020; --edge2:#3b2414; --gold:#e0a020;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c120b; --surface:#2e2014; --ink:#f3e2b9; --muted:#c2a275; --line:#5a3d22;
    --accent:#7fc062; --accent-soft:rgba(127,192,98,.2); --on-accent:#1c120b; --warn:#e8896f;
    --edge:#8a5a30; --edge2:#0f0904; --gold:#f2c14a;
  }
}
:root[data-theme="dark"]{
  --bg:#1c120b; --surface:#2e2014; --ink:#f3e2b9; --muted:#c2a275; --line:#5a3d22;
  --accent:#7fc062; --accent-soft:rgba(127,192,98,.2); --on-accent:#1c120b; --warn:#e8896f;
  --edge:#8a5a30; --edge2:#0f0904; --gold:#f2c14a;
}
body,button,input,select{font-family:"Pixelify Sans","Hanken Grotesk",system-ui,sans-serif}
body{
  font-size:17px;
  background:var(--bg) repeating-linear-gradient(0deg,transparent 0 46px,rgba(59,36,20,.07) 46px 48px);
}
.top{font-size:16px;color:var(--muted)}
.money{font-size:54px;font-weight:700;letter-spacing:0;color:var(--ink);text-shadow:3px 3px 0 var(--line);display:flex;align-items:center;gap:12px}

/* ---------- engine environment: events out, clock and dice in ----------
   The engine never touches the DOM or storage. It announces what happened with emit(name,data);
   the UI listens with onEv(name,fn). now() and random() are its only clock and dice.
   random() is seeded (mulberry32) and keeps its state in S.rng, so a save replays the same dice.
   setEnv({now,seed}) replaces the clock and the seed of the next new game (tests). */
var BUS={},ENV={now:Date.now,seed:function(){return Math.floor(Math.random()*4294967296)|0}};
function onEv(ev,fn){(BUS[ev]=BUS[ev]||[]).push(fn)}
function emit(ev,a){var l=BUS[ev];if(l)for(var i=0;i<l.length;i++)l[i](a)}
function setEnv(o){for(var k in o)ENV[k]=o[k]}
function now(){return ENV.now()}
function random(){
  var a=S.rng=((S.rng|0)+0x6D2B79F5)|0,t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296;
}
function toast(m){emit("toast",m)}
/* ---------- state ---------- */
/* Saves are upgraded one numbered step at a time. A save without v is version 0 (everything saved
   before versions existed). To change the save format: add a step at the end, never edit an old one,
   and add a fixture to tests/saves/. Each step also gets the raw saved object, to tell "missing in
   the save" from "filled in by def()". */
var MIGRATIONS=[
  /* 0 -> 1: wages scale with the venue; saves from before stored stand-level wages */
  function(raw){if(S.kits&&!raw.wkMig){var wk0=wk();if(wk0!==1)S.team.forEach(function(e){e.wage=Math.round(e.wage*wk0/10)*10})}S.wkMig=1},
  /* 1 -> 2: weekly schedules and overtime are gone; overtime already owed counts as payroll */
  function(){
    S.team.forEach(function(e){delete e.sch;delete e.ot});
    [S.month,S.lastMonth].forEach(function(m){if(m&&m.ot!==undefined){m.pay+=m.ot||0;delete m.ot}});
  }
];
function defHours(){var a=[];for(var i=0;i<7;i++)a.push([10,22]);return a}

/* every field the game uses, with the value it has before the feature is first touched */
function def(){var seed=ENV.seed();return{v:MIGRATIONS.length,seed:seed,rng:seed,money:300,totalEarned:0,served:0,walkouts:0,
  ing:{},ql:{},brand:{},stock:{},bat:{},auto:{},par:{},parCat:{},notes:[],
  price:{},act:{},cprice:{},staff:{},train:{},upg:{},exp:0,expAt:0,
  orders:[],jobs:[],hold:[],arrive:2,nextId:1,sat:60,reorders:0,
  mkt:{drift:{},ev:[],next:80,t20:20},ctlT:15,chefB:0,
  rep:0,pts:0,perm:{},ach:{},sold:{p:false,u:false},paidDebt:false,
  debt:0,late:0,mcount:0,month:newMonth(),lastMonth:null,notice:null,
  gt:600,curDay:0,hours:defHours(),dayE:0,dayN:0,prev:{e:0,n:0},
  picks:{},known:[],kits:false,barName:"",
  team:[],cands:{},mood:60,moodB:0,nextEmp:1,maxStaff:{},starter:{},wkMig:1,
  hhUntil:0,hhReady:0,last:now(),newRec:false,
  /* long-term systems */
  ms:{offers:[],active:[],next:1,day:-1,done:0,failed:0,earned:0,last:null,seen:true},
  reg:[],nextReg:0,guide:null,deco:{items:{},theme:null},sup:{mode:"spot"},nights:{},mods:[],ban:{},
  inc:null,calmed:0,br:[],leg:{pts:0,perks:{}},legacy:0}}

/* load a saved object: defaults first, then the save, then the migration steps it has not had yet */
function fromSave(raw){S=Object.assign(def(),raw);S.v=raw.v||0;migrate(raw)}
function migrate(raw){
  /* repairs: cheap checks that keep a damaged save playable */
  if(!Array.isArray(S.hours)||S.hours.length!==7)S.hours=defHours();
  if(!S.prev)S.prev={e:0,n:0};
  if(!S.month)S.month=newMonth();
  if(!Array.isArray(S.team))S.team=[];
  for(var v=S.v||0;v<MIGRATIONS.length;v++)MIGRATIONS[v](raw||{});
  S.v=Math.max(S.v||0,MIGRATIONS.length);
  syncStaff();
}
/* ---------- helpers ---------- */
var SUF=["","k","M","B","T","Qa","Qi","Sx","Sp"];
function fmt(n){
  if(!isFinite(n))return "∞";
  if(n<1000){return n<10?n.toFixed(2):n<100?n.toFixed(1):String(Math.floor(n))}
  var i=0;while(n>=1000&&i<SUF.length-1){n/=1000;i++}
  return (n<10?n.toFixed(2):n<100?n.toFixed(1):n.toFixed(0))+SUF[i];
}
function eur(n){return "$"+fmt(n)}
function money0(n){return "$"+Math.round(n).toLocaleString("en-US")}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lvl(id){return S.perm[id]||0}
function has(id){return !!S.ing[id]}
function teamSize(){return S.team.length}
function roleUnlocked(id){return !!S.upg[id==="prepchef"?"kitchen":id]}
function chefActive(){return !!S.upg.kitchen&&(S.staff.prepchef||0)>0}
function wpick(arr,wf){
  var t=0,i;for(i=0;i<arr.length;i++)t+=wf(arr[i]);
  var r=random()*t;
  for(i=0;i<arr.length;i++){r-=wf(arr[i]);if(r<=0)return arr[i]}
  return arr[arr.length-1];
}

/* stock keys: tier 0 is the plain id, better brands are id#1 and id#2 */
function skey(id,t){return t?id+"#"+t:id}
function baseId(key){var i=key.indexOf("#");return i<0?key:key.slice(0,i)}
function tierOfKey(key){var i=key.indexOf("#");return i<0?0:parseInt(key.slice(i+1),10)}
function tierName(x,t){
  if(x.id==="beer"||x.id==="wine")return x.tn[t];
  return t?x.tn[t]+" "+x.n.toLowerCase():x.n;
}
function keyName(key){return tierName(INGM[baseId(key)],tierOfKey(key)).toLowerCase()}
function shelfOf(key){return SHELF[baseId(key)]||0}
function brandOf(id){return Math.min(S.brand[id]||0,S.ql[id]||0)}
function addStock(key,n){
  S.stock[key]=(S.stock[key]||0)+n;
  if(shelfOf(key)){(S.bat[key]=S.bat[key]||[]).push({d:Math.floor(S.gt/1440),n:n})}
}
function takeStock(key,n){
  S.stock[key]=(S.stock[key]||0)-n;
  if(shelfOf(key)){
    var b=S.bat[key],r=n;
    if(b){while(r>0&&b.length){if(b[0].n>r){b[0].n-=r;r=0}else{r-=b[0].n;b.shift()}}}
  }
}
function spoil(quiet){
  var d=Math.floor(S.gt/1440),cost=0;
  for(var key in S.bat){
    var sh=shelfOf(key),b=S.bat[key],x=INGM[baseId(key)];
    while(b.length&&b[0].d+sh<=d){
      var n=b[0].n;b.shift();
      var care=empAvg("clerk",1),keep=care>0?0.06*(care-1)*n:0,saved=Math.floor(keep)+(random()<keep-Math.floor(keep)?1:0);
      if(saved>0){n=Math.max(0,n-saved);b.push({d:d,n:saved})}
      S.stock[key]=Math.max(0,(S.stock[key]||0)-n);
      cost+=n*(x.q?x.u[tierOfKey(key)]:x.u);
    }
  }
  if(cost>0){S.month.waste+=cost;if(!quiet&&cost>=5)toast("Spoiled stock: "+eur(cost))}
}

/* the menu: which drinks are on offer */
function unlocked(it){
  if(it.solo)return has(it.ing)&&(S.ql[it.ing]||0)>=it.tier;
  return it.i.every(has);
}
function itemKeys(it){
  if(it.solo)return [skey(it.ing,it.tier)];
  return it.i.map(function(id){return skey(id,INGM[id].q?brandOf(id):0)});
}
var MI=null;
function menuChanged(){MI=null;emit("menu")}   /* ingredients or menu changed: drop the cache, tell the UI */
function mi(){
  if(MI)return MI;
  var list=ITEMS.filter(unlocked),fam={};
  list.forEach(function(r){if(!r.solo&&r.f!=="Soft")fam[r.f]=(fam[r.f]||0)+1});
  var bf="",bn=0;for(var f in fam){if(fam[f]>bn){bn=fam[f];bf=f}}
  MI={list:list,bf:bf,bn:bn,spec:bn>=7?2:bn>=5?1.6:bn>=3?1.25:1};
  return MI;
}

/* market */
var MK={};
function recomputeMarket(){
  MK={};
  ING.forEach(function(x){
    var m=S.mkt.drift[x.id]||1;
    S.mkt.ev.forEach(function(e){if(e.ids==="all"||e.ids.indexOf(x.id)>=0)m*=e.f});
    eventsOn(gDay()).forEach(function(e){if(e.mk&&(e.mk.ids==="all"||e.mk.ids.indexOf(x.id)>=0))m*=e.mk.f});
    MK[x.id]=m;
  });
}
function mkt(id){
  var key=RAWOF[id]||id,base=MK[key]||1,m=supMode();
  if(m==="contract"&&S.sup.lk&&S.sup.lk[key]!==undefined)return S.sup.lk[key];
  if(m==="volume")return base*0.92;
  if(m==="premium")return base*1.12;
  return base;
}
function disc(){return 1-0.06*lvl("disc")-0.025*Math.max(0,roleSkill("clerk",0)-1)-0.025*Math.max(0,roleSkill("controller",0)-1)}
function unitCost(x,t){return (x.q?x.u[t||0]:x.u)*mkt(x.id)*disc()}
function effUnit(x,t){
  if(x.pre&&chefActive()){var raw=INGM[x.pre.raw];return raw.u*mkt(raw.id)*0.7*disc()/x.pre.y}
  return unitCost(x,t);
}
function itemCost(it){var c=0;itemKeys(it).forEach(function(k){c+=effUnit(INGM[baseId(k)],tierOfKey(k))});return c}
function costRatio(it){
  var a=0,b=0;
  itemKeys(it).forEach(function(k){var x=INGM[baseId(k)],u=x.q?x.u[tierOfKey(k)]:x.u;a+=u*mkt(x.id);b+=u});
  return a/b;
}

/* prices: value = what a drink is worth. fair = what customers accept today (follows ingredient costs).
   price = what you charge: your own number, the cost controller's, or the value you last set it to. */
function quality(it){
  if(it.solo)return 1;
  var s=0,n=0;
  it.i.forEach(function(id){if(INGM[id].q){s+=QV[brandOf(id)];n++}});
  return n?s/n:1;
}
function valueOf(it){
  var m=mi();
  var v=it.p*quality(it)*(S.upg.glass?1.2:1);
  if(!it.solo&&m.spec>1&&it.f===m.bf)v*=m.spec;
  return v;
}
function fairOf(it){return valueOf(it)*(0.6+0.4*costRatio(it))*(1+0.08*lvl("awards"))}
/* the price you set (or the controller sets) waits until the bar opens; priceOf is what is on the menu right now */
function stagedPrice(it){
  if(S.price[it.id]!==undefined)return S.price[it.id];
  if(S.staff.controller>0&&S.cprice[it.id]!==undefined)return S.cprice[it.id];
  return valueOf(it);
}
function priceOf(it){return S.act[it.id]!==undefined?S.act[it.id]:stagedPrice(it)}
function applyPrices(){ITEMS.forEach(function(it){S.act[it.id]=stagedPrice(it)})}
function ctlPrices(){
  if(onShift("controller")<1)return;
  var an=1+0.012*(roleSkill("controller",1)-1);
  ITEMS.forEach(function(it){if(unlocked(it))S.cprice[it.id]=fairOf(it)*an});
}
function demandFactor(q){return q<=1?1:Math.exp(-0.8*(q-1))}
function priceScore(q){return clamp(75-80*(q-1),0,100)}

/* reputation */
function repLevel(){return Math.floor(Math.sqrt(Math.max(0,S.rep)/25))}
function repName(L){return REPN[Math.min(L,REPN.length-1)]}
function addRep(x,quiet){
  var before=repLevel();
  S.rep=Math.max(0,S.rep+x);
  var after=repLevel();
  if(after>before){S.pts+=after-before;if(!quiet)toast("Reputation level "+after+": "+repName(after)+". +"+(after-before)+" perk point")}
}
function checkAch(quiet){
  ACH.forEach(function(a){
    if(!S.ach[a.id]&&a.ok()){S.ach[a.id]=1;addRep(a.r,quiet);if(!quiet)toast("Achievement: "+a.n+" (+"+a.r+" reputation)")}

      return w;
    });

    if((re&&re.rid&&i===0)||random()<demandFactor(q))items.push({r:it.id,done:false});
  }
  if(!items.length){if(!re)addSat(15);return}   /* too expensive: the customer walks away */
  var n=items.length;

  var od={id:S.nextId++,cid:re?re.cid:undefined,re:re&&re.n?re.n:0,rid:re?re.rid:undefined,slot:slot,who:cust.n,m:cust.m,cls:cls,items:items,pat:pat,left:pat,ready:false,reward:0,sat:0};
  if(per>=3&&!(re&&re.n)&&random()<rowdyChance(cust,per)){od.rowdy=true;od.rt=0}

function orderBase(o){var b=0;o.items.forEach(function(it){b+=priceOf(ITM[it.r])});return b}

function finishOrder(o){
  o.ready=true;
  var b=0,ps=0;
  o.items.forEach(function(it){
    var r=ITM[it.r],pr=priceOf(r);
    b+=pr;ps+=priceScore(pr/(fairOf(r)*WTP[o.cls]));
    if(r.solo){if(r.tier>=1)S.sold.p=true;if(r.tier>=2)S.sold.u=true}
  });
  ps/=o.items.length;
  var frac=Math.max(0,o.left/o.pat);
  o.sat=0.6*ps+0.4*(40+60*frac);
  var ce=cashierAt(o.slot);
  o.sat=clamp(o.sat+4*(floorAvg(2)-2.5)*perfMult()+(ce?2.5*(ce.sk[0]-1):0)+(fxNow().sat||0)+styleSat()+(supMode()==="premium"?2:0),0,100);
  addSat(o.sat);
  S.month.gs=(S.month.gs||0)+o.sat;S.month.gn=(S.month.gn||0)+1;S.month.gp=(S.month.gp||0)+ps;
  o.reward=b*(1+tipMax()*frac*o.m)*(ce?1+0.02*ce.sk[1]:1)*(o.rid?1+bondOf(o.rid)/300:1)*(1+0.04*legLvl("fame"));
  if(ce)collect(o);
}
var MAXRE=3;   /* a happy customer can ask for another round up to this many times */
function reorderChance(o){

  var hosp=clamp((floorAvg(2)-1)/4,0,1),ce=cashierAt(o.slot),charm=ce?clamp((ce.sk[0]-1)/4,0,1):0;
  var satF=clamp((o.sat-55)/45,0,1);
  return clamp(satF*(0.10+0.25*hosp+0.20*charm+(o.rid?bondOf(o.rid)/500:0))*Math.pow(0.75,rc),0,0.6);
}
function collect(o){
  var ix=S.orders.indexOf(o);if(ix<0)return;

  S.dayE+=o.reward;S.dayN++;S.month.rev+=o.reward;
  earn(o.reward);

  (S.hold=S.hold||[]).push({slot:o.slot,left:again?4+random()*5:lingerTime(),id:o.cid||o.id,who:o.who,cls:o.cls,rid:o.rid,drink:o.items&&o.items[0]?o.items[0].r:null,again:again,re:(o.re||0)+1});

function startJob(){

function buyStock(id,t){

/* the prep chef turns raw produce into syrup and juices */
function chefTick(dt){

  S.chefB=Math.min(24,(S.chefB||0)+n*0.6*dt*(1+0.1*(roleSkill("prepchef",1)-1))*perfMult());

/* market: slow drift plus news events */
function tickMarket(dt,quiet){
  var M=S.mkt,changed=false;
  M.t20-=dt;
  if(M.t20<=0){
    M.t20=20;
    ING.forEach(function(x){
      var d=M.drift[x.id]||1;
      d+=(1-d)*0.15+(random()-0.5)*0.08;
      M.drift[x.id]=clamp(d,0.75,1.35);
    });
    changed=true;
  }
  for(var i=M.ev.length-1;i>=0;i--){
    M.ev[i].left-=dt;
    if(M.ev[i].left<=0){M.ev.splice(i,1);changed=true}
  }
  M.next-=dt;
  if(M.next<=0){
    M.next=100+random()*100;
    if(M.ev.length<3){
      var opts=NEWS.filter(function(n){return n.ids==="all"||n.ids.some(relevantId)});
      if(opts.length){
        var n=opts[Math.floor(random()*opts.length)];
        M.ev.push({h:n.h,ids:n.ids,f:n.f,left:n.dur});
        changed=true;
        if(!quiet)toast("News: "+n.h);
      }
    }
  }
  if(changed)recomputeMarket();
}

/* the cost controller watches prices and tells clerks how much stock to hold */
function addNote(s){S.notes.unshift(s);if(S.notes.length>4)S.notes.length=4}
function controllerTick(dt){
  if(onShift("controller")<1)return;
  S.ctlT-=dt;if(S.ctlT>0)return;
  S.ctlT=15;
  ctlPrices();
  ING.forEach(function(x){
    if(x.raw||!has(x.id)||!S.auto[x.id])return;
    var m=mkt(x.id),cat=m>=1.25?"hi":m<=0.85?"lo":"ok";
    var par=cat==="hi"?3:cat==="lo"?Math.floor(cap()*0.8):10;
    S.par[x.id]=par;
    var prev=S.parCat[x.id];
    if(prev!==cat){
      S.parCat[x.id]=cat;
      var pc=Math.round(Math.abs(m-1)*100);
      if(cat==="hi")addNote(x.n+" is "+pc+"% above normal. Clerks will hold only "+par+".");
      else if(cat==="lo")addNote(x.n+" is "+pc+"% below normal. Clerks will stock up to "+par+".");
      else if(prev)addNote(x.n+" is back to normal. Clerks hold "+par+" again.");
    }
  });
}

function tick(dt,quiet){
  T+=dt;
  tickMarket(dt,quiet);
  controllerTick(dt);
  var hh=now()<S.hhUntil;
  /* the clock: time flies while the bar is closed */
  var open=isOpenNow();
  if(wasOpen&&!open)ctlPrices();
  if(!wasOpen&&open)applyPrices();
  wasOpen=open;
  S.gt+=dt*(open?1:12);
  var dn=gDay();
  if(dn!==S.curDay){S.curDay=dn;dayChange(quiet)}
  /* customers arrive, but only while the bar is open */
  if(open&&freeSlot()>=0){
    S.arrive-=dt*(hh?2:1)*arrivalMult()*demandNow();
    if(S.arrive<=0){spawnOrder();S.arrive=interval()*(0.8+random()*0.4)}
  }
  if(S.hold){for(var hi=S.hold.length-1;hi>=0;hi--){
    var hd=S.hold[hi];hd.left-=dt;
    if(hd.left<=0){
      S.hold.splice(hi,1);
      if(hd.again&&open){var ct=null;for(var ci=0;ci<CUST.length;ci++){if(CUST[ci].n===hd.who)ct=CUST[ci]}
        if(ct)spawnOrder({slot:hd.slot,cust:ct,cls:hd.cls,cid:hd.id,n:hd.re,rid:hd.rid})}
    }
  }}
  /* patience */
  for(var i=S.orders.length-1;i>=0;i--){
    var o=S.orders[i];
    if(o.ready)continue;
    o.left-=dt;
    if(o.rowdy){rowdyStep(o,dt,quiet);if(o.gone)continue}
    if(o.left<=0){if(o.rid)regBond(o.rid,-15);dropOrder(o);S.walkouts++;addSat(0);if(!quiet)toast(o.who+" got tired of waiting and left.")}
  }
  /* team works */
  var W=workers();
  for(var j=S.jobs.length-1;j>=0;j--){
    var job=S.jobs[j],sp=W[j];
    if(sp===undefined)continue;
    var od=findOrder(job.o);
    if(!od){S.jobs.splice(j,1);continue}
    job.p+=sp*dt;
    if(job.p>=prepTime(ITM[od.items[job.i].r])){
      od.items[job.i].done=true;
      S.jobs.splice(j,1);
      if(od.items.every(function(it){return it.done}))finishOrder(od);
    }
  }
  var guard=0;
  while(S.jobs.length<W.length&&guard++<30){if(!startJob())break}
  /* cashiers collect for their own slot */
  var cs=onShift("cashier");
  if(cs>0)S.orders.filter(function(o){return o.ready&&o.slot<cs}).forEach(collect);
  /* the prep chef */
  chefTick(dt);
  /* clerks restock their ingredients, every quality in stock */
  var capNow=shiftCounts().clerk_lv||0,watched=0;
  if(capNow>0){
    for(var k=0;k<ING.length;k++){
      var x=ING[k];
      if(x.raw||!has(x.id)||!S.auto[x.id])continue;
      if(x.pre&&chefActive())continue;
      if(watched>=capNow)break;
      watched++;
      var top=x.q?(S.ql[x.id]||0):0;
      for(var t2=0;t2<=top;t2++){if((S.stock[skey(x.id,t2)]||0)<parOf(x.id))buyStock(x.id,t2)}
    }
  }
  /* safety net: never get stuck without lemons or money */
  if(S.money<5&&(S.stock.lemonjuice||0)===0&&S.jobs.length===0){
    S.money+=10;
    if(!quiet)toast("A regular lent you $10 for lemons.");
  }
}

  var steps=Math.floor(secs/2);
  var m0=S.totalEarned,s0=S.served;
  for(var i=0;i<steps;i++)tick(2,true);
  recent=[];
  return{earned:S.totalEarned-m0,served:S.served-s0};

/* tree nodes */
function nLevel(n){return n.kind==="upg"?(S.upg[n.id]?1:0):n.kind==="train"?(S.train[n.role]||0):lvl(n.id)}
function nMax(n){return n.kind==="upg"?1:n.kind==="train"?3:n.max}

function costText(n,l){var c=nCost(n,l);return n.kind==="perm"?c+(c>1?" pts":" pt"):eur(c)}
function canPay(n,l){var c=nCost(n,l);return n.kind==="perm"?S.pts>=c:S.money>=c}
function nReqMet(n){
  var ok=(n.req||[]).every(function(id){return nLevel(NODEMAP[id])>=1});

/* ---------- special missions: finish a task before it runs out for a cash bonus ---------- */
var MS_DAYREV=[505,3000,10400,22300,34000];
var MS_MAX=2;     /* missions you can hold at once */     /* typical revenue of one day in each venue; rewards are a share of it */
function msInit(){if(!S.ms)S.ms={offers:[],active:[],next:1,day:-1,done:0,failed:0,earned:0,last:null,seen:true};return S.ms}
function msExpected(list){
  /* how many drinks a day the bar sells, and each drink's share of them */
  var hr=S.hours[gDay()%7],span=Math.max(6,spanOf(hr[0],hr[1])),arrivals=span*60/interval()*arrivalMult()*0.9;
  var perOrder=1+(EXPS[S.exp].k+(S.upg.table?1:0)-1)/2,tot=0,w={};
  list.forEach(function(x){w[x.id]=Math.pow(x.p,0.6)*(x.solo?0.5:1);tot+=w[x.id]});
  return{perDay:arrivals*perOrder,share:function(x){return tot?w[x.id]/tot:0}};
}
function msRound(v){return Math.max(10,Math.round(v/10)*10)}
function msGenerate(){
  var ms=msInit(),m=mi(),list=m.list.filter(function(x){return !x.solo});
  if(!list.length)list=m.list;
  ms.offers=[];
  if(!list.length)return;
  var ex=msExpected(m.list),flat=MS_DAYREV[S.exp];
  var fams={};list.forEach(function(x){(fams[x.f]=fams[x.f]||[]).push(x)});
  var famNames=Object.keys(fams).filter(function(f){return fams[f].length>=2});
  var avg=0;m.list.forEach(function(x){avg+=priceOf(x)});avg=avg/m.list.length||1;
  var types=["drink","family","streak","drink"],picks=[],usedItem={};
  while(picks.length<3&&types.length){var t=types.splice(Math.floor(random()*types.length),1)[0];if(picks.indexOf(t)<0||t==="drink")picks.push(t)}
  picks.forEach(function(type){
    if(type==="drink"&&!list.some(function(x){return !usedItem[x.id]}))type="streak";
    var id=ms.next++,n,m1,days,jitter=0.8+random()*0.5;
    if(type==="drink"||(type==="family"&&!famNames.length)){
      var it=wpick(list,function(x){return usedItem[x.id]?0.0001:Math.pow(x.p,0.6)});usedItem[it.id]=1;
      days=4;n=Math.max(6,Math.min(90,Math.round(ex.perDay*ex.share(it)*days*1.6*jitter)));
      m1={id:id,type:"drink",item:it.id,n:n,days:days,title:"Serve "+n+" "+it.n,reward:msRound(flat*0.25*clamp(priceOf(it)/avg,0.8,1.3))};
    }else if(type==="family"){
      var fam=famNames[Math.floor(random()*famNames.length)],sh=0,fa=0;
      fams[fam].forEach(function(x){sh+=ex.share(x);fa+=priceOf(x)});fa=fa/fams[fam].length;
      days=5;n=Math.max(10,Math.min(200,Math.round(ex.perDay*sh*days*1.6*jitter)));
      m1={id:id,type:"family",fam:fam,n:n,days:days,title:"Serve "+n+" "+fam.toLowerCase()+" drinks",reward:msRound(flat*0.22*clamp(fa/avg,0.8,1.3))};
    }else{
      days=4;n=30+Math.floor(random()*21);
      m1={id:id,type:"streak",n:n,days:days,title:"Serve "+n+" orders in a row without losing a customer",reward:msRound(flat*0.14)};
    }
    ms.offers.push(m1);
  });
}
function msAccept(id){
  var ms=msInit();if(ms.active.length>=MS_MAX)return false;
  for(var i=0;i<ms.offers.length;i++){if(ms.offers[i].id===id){var m1=ms.offers.splice(i,1)[0];m1.p=0;m1.dl=gDay()+m1.days;ms.active.push(m1);return true}}
  return false;
}
function msAbandon(id){var ms=msInit();ms.active=ms.active.filter(function(m1){return m1.id!==id})}
function msStreakBreak(){var ms=S.ms;if(!ms)return;ms.active.forEach(function(m1){if(m1.type==="streak")m1.p=0})}
function msComplete(m1){
  var ms=msInit();ms.active=ms.active.filter(function(x){return x!==m1});
  S.money+=m1.reward;S.totalEarned+=m1.reward;S.month.rev+=m1.reward;S.dayE+=m1.reward;
  ms.done++;ms.earned+=m1.reward;ms.last={t:m1.title,r:m1.reward};
  toast("Mission complete: "+m1.title+". +"+money0(m1.reward));
}
function msProgress(o){
  var ms=S.ms;if(!ms||!ms.active.length)return;
  var done=[];
  ms.active.forEach(function(m1){
    if(m1.type==="drink"){o.items.forEach(function(it){if(it.r===m1.item)m1.p++})}
    else if(m1.type==="family"){o.items.forEach(function(it){if(ITM[it.r].f===m1.fam)m1.p++})}

/* ---------- UI: skill trees ---------- */
function setA(e,k,v){if(e["_"+k]!==v){e["_"+k]=v;e.setAttribute(k,v)}}
function mkTree(root,nodes,labels,cols){
  var NS="http://www.w3.org/2000/svg";
  var wrap=el("div","tree");
  if(labels){
    var lb=el("div","tlabels");lb.style.gridTemplateColumns="repeat("+cols+",1fr)";
    labels.forEach(function(x){lb.appendChild(el("span",null,x))});wrap.appendChild(lb);
  }
  var grid=el("div","tgrid"+(cols>3?" c"+cols:""));
  grid.style.gridTemplateColumns="repeat("+cols+",1fr)";
  var svg=document.createElementNS(NS,"svg");
  svg.setAttribute("class","tlines");svg.setAttribute("aria-hidden","true");
  grid.appendChild(svg);
  var tr={nodes:nodes,tiles:{},edges:[],svg:svg,grid:grid,sel:nodes[0].id};
  nodes.forEach(function(n){
    var b=el("button","tile"),nm=el("span","tn",n.n),st=el("span","ts");
    b.style.gridColumn=String(n.col+1);b.style.gridRow=String(n.row+1);
    b.append(nm,st);
    b.onclick=function(){tr.sel=n.id;updateTree(tr)};
    grid.appendChild(b);tr.tiles[n.id]={b:b,st:st};
    (n.req||[]).forEach(function(pid){
      var pa=document.createElementNS(NS,"path");
      svg.appendChild(pa);tr.edges.push({from:pid,to:n.id,el:pa});
    });
  });
  wrap.appendChild(grid);
  var det=el("div","tdetail"),dn=el("div","tdn"),dd=el("div","tdd"),dm=el("div","tdm"),db=el("button","big");
  det.append(dn,dd,dm,db);wrap.appendChild(det);
  tr.dn=dn;tr.dd=dd;tr.dm=dm;tr.db=db;
  db.onclick=function(){nBuy(NODEMAP[tr.sel]);updateTree(tr)};
  root.appendChild(wrap);
  return tr;
}
function updateTree(tr){
  tr.nodes.forEach(function(n){
    var t=tr.tiles[n.id],l=nLevel(n),mx=nMax(n),met=nReqMet(n),cls="tile",txt;
    if(l>=mx){cls+=" owned";txt=mx>1?"Max "+l+"/"+mx:"Owned"}
    else if(!met){cls+=" locked";txt="Locked"}
    else{if(canPay(n,l))cls+=" can";txt=(mx>1?l+"/"+mx+"  ":"")+costText(n,l)}
    if(l>0&&l<mx)cls+=" part";
    if(tr.sel===n.id)cls+=" sel";
    setC(t.b,cls);setT(t.st,txt);
  });
  tr.edges.forEach(function(e){setA(e.el,"class",nLevel(NODEMAP[e.from])>=1?"on":"")});
  var n=NODEMAP[tr.sel],l=nLevel(n),mx=nMax(n);
  setT(tr.dn,n.n+(mx>1?"  ("+l+"/"+mx+")":""));
  setT(tr.dd,n.d);
  if(l>=mx){setT(tr.dm,"Fully upgraded.");setT(tr.db,"Maxed");tr.db.disabled=true}
  else if(!nReqMet(n)){setT(tr.dm,"Requires: "+nReqText(n));setT(tr.db,"Locked");tr.db.disabled=true}
  else{setT(tr.dm,"Cost: "+costText(n,l));setT(tr.db,"Buy for "+costText(n,l));tr.db.disabled=!canPay(n,l)}
}
function drawTree(tr){
  var g=tr.grid,W=g.offsetWidth,H=g.offsetHeight;
  if(!W)return;
  tr.svg.setAttribute("viewBox","0 0 "+W+" "+H);tr.svg.setAttribute("width",W);tr.svg.setAttribute("height",H);
  tr.edges.forEach(function(e){
    var a=tr.tiles[e.from].b,c=tr.tiles[e.to].b;
    var ax=a.offsetLeft,ay=a.offsetTop,aw=a.offsetWidth,ah=a.offsetHeight;
    var cx=c.offsetLeft,cy=c.offsetTop,cw=c.offsetWidth,ch=c.offsetHeight,d;
    if(cy>ay+ah/2){
      var x1=ax+aw/2,y1=ay+ah,x2=cx+cw/2,y2=cy,my=(y1+y2)/2;
      d="M"+x1+" "+y1+" C"+x1+" "+my+" "+x2+" "+my+" "+x2+" "+y2;
    }else if(cx>ax){d="M"+(ax+aw)+" "+(ay+ah/2)+" L"+cx+" "+(cy+ch/2)}
    else{d="M"+ax+" "+(ay+ah/2)+" L"+(cx+cw)+" "+(cy+ch/2)}
    e.el.setAttribute("d",d);
  });
}

/* ---------- UI: update ---------- */
function hint(x){
  /* no recipe hints: the player buys first and finds out what it unlocks */
  if(SPIRITS.indexOf(x.id)>=0)return x.q?"A spirit. Also sold neat.":"A spirit.";
  if(LIQUEURS.indexOf(x.id)>=0)return "A liqueur or wine.";
  if(MIXERS.indexOf(x.id)>=0)return "A mixer.";
  return x.q?"Also sold neat.":"An ingredient for your bar.";
}
function moodWord(q){return q<=0.85?"Bargain":q<=1.15?"Fair":q<=1.6?"Pricey":"Too pricey"}
function satTeam(v){return v>=80?"Thrilled":v>=60?"Happy":v>=40?"Okay":v>=25?"Unhappy":"About to walk out"}
function satWord(v){return v>=80?"Delighted":v>=60?"Happy":v>=40?"Okay":v>=20?"Unhappy":"Furious"}
function mshow(n){return n<1e6?"$"+Math.round(n).toLocaleString("en-US"):eur(n)}

function updateOrders(W){
  var slots=maxSlots(),cs=onShift("cashier"),map={};
  S.orders.forEach(function(o){map[o.slot]=o});
  var openNow=isOpenNow();
  for(var i=0;i<5;i++){
    var c=ref.ord[i],o=map[i];
    if(i>=slots){c.card.style.display="none";continue}
    c.card.style.display="";
    if(!o){
      setC(c.card,"ocard empty");c.empty.style.display="";c.body.style.display="none";c.oid=0;
      setT(c.empty,!openNow?"The bar is closed.":(i<cs?"Cashier on duty. Waiting for the next customer…":"Waiting for the next customer…"));
      continue;
    }
    c.oid=o.id;
    setC(c.card,"ocard"+(o.ready?" ready":""));
    c.empty.style.display="none";c.body.style.display="";
    setT(c.who,o.who+(o.cls>=2?" ("+CLASSN[o.cls]+")":""));
    setT(c.rew,o.ready?"Paid "+eur(o.reward)+" · "+satWord(o.sat):"Up to "+eur(maxReward(o)));
    for(var k=0;k<3;k++){
      var ln=c.lines[k],it=o.items[k];
      if(!it){ln.l.style.display="none";continue}
      ln.l.style.display="";
      var r=ITM[it.r];
      setT(ln.nm,r.n);
      if(it.done){setT(ln.st,"Done");setC(ln.st,"ost ok")}
      else{
        var job=jobFor(o.id,k);
        if(job){
          var idx=S.jobs.indexOf(job);
          if(idx>=W.length){setT(ln.st,"Waiting for a free hand");setC(ln.st,"ost")}
          else{setT(ln.st,"Mixing "+Math.min(99,Math.floor(job.p/prepTime(r)*100))+"%");setC(ln.st,"ost")}
        }else{
          var ms=missingOf(r);
          if(ms){setT(ln.st,"Out of "+keyName(ms));setC(ln.st,"ost bad")}
          else{setT(ln.st,"Queued");setC(ln.st,"ost")}
        }
      }
    }
    c.fill.style.width=(o.ready?100:Math.max(0,o.left/o.pat*100))+"%";
    c.skip.style.display=o.ready?"none":"";
    c.collectBtn.style.display=o.ready?"":"none";
    setT(c.note,i<cs?"Cashier on duty":"");
    if(o.ready)setT(c.collectBtn,"Collect "+eur(o.reward));
  }
}

function updateCal(){
  var C=ref.cal,today=gDay(),sel=C.sel;
  var vt=dateOf(C.vm*28);
  setT(C.ttl,MONN[vt.m]+" · Year "+vt.year);
  for(var i=0;i<28;i++){
    var d=C.vm*28+i,evs=eventsOn(d),cell=C.cells[i];
    var hol=evs.some(function(e){return e.hol}),rn=evs.some(function(e){return !e.hol});
    setT(cell.n,String(i+1));
    setT(cell.mk,(hol?"●":"")+(rn?"○":""));
    setC(cell.b,"cday"+(d===today?" today":d<today?" past":"")+(d===sel?" sel":""));
  }
  var se=eventsOn(sel);
  setT(C.dt,dstr(sel)+(sel===today?" (today)":""));
  for(var k=0;k<3;k++){
    var ln=C.evl[k],ev=se[k];
    if(ev){ln.style.display="";setT(ln,ev.n+(ev.len>1?" (day "+(ev.k+1)+" of "+ev.len+")":"")+": "+fxText(ev))}
    else if(k===0){ln.style.display="";setT(ln,"A regular day. Weekends are busier than Mondays.")}
    else ln.style.display="none";
  }
  var fx=fxFor(sel),dm=[],mx=0.01,h2;
  for(h2=0;h2<24;h2++){var v=demandAt(sel,h2,fx);dm.push(v);if(v>mx)mx=v}
  for(h2=0;h2<24;h2++){
    var bar=C.bars[h2],ph=Math.max(4,Math.round(dm[h2]/mx*100));
    if(bar._ph!==ph){bar._ph=ph;bar.style.height=ph+"%"}
    setC(bar,(isOpenAt(sel,h2)?"open":"")+(sel===today&&Math.floor(gHour())===h2?" now":""));
  }
  for(var p=0;p<6;p++){
    var arr=CUST.map(function(c){return{n:c.n,w:c.w[p]*(fx.type[c.n]||1)}}).filter(function(x){return x.w>0}).sort(function(a,b){return b.w-a.w}).slice(0,3);
    setT(C.mix[p],PERL[p]+" "+PERN[p]+": "+arr.map(function(x){return x.n.toLowerCase()}).join(", "));
  }
  setT(C.sum,sel===today?"Yesterday: "+eur(S.prev.e)+" from "+S.prev.n+" orders. Today so far: "+eur(S.dayE)+".":"Green bars are the hours the bar is open. Taller bars are busier hours.");
  for(var w=0;w<7;w++){
    var r=C.hr[w],hv=S.hours[w];
    if(document.activeElement!==r.so&&r.so._v!==hv[0]){r.so._v=hv[0];r.so.value=String(hv[0])}
    if(document.activeElement!==r.sc&&r.sc._v!==hv[1]){r.sc._v=hv[1];r.sc.value=String(hv[1])}
    setT(r.sp,hv[0]===hv[1]?"Closed":spanOf(hv[0],hv[1])+" h");
  }
}


function update(){
  var now=Date.now(),W=workers(),openNow=isOpenNow();
  setT($("#money"),mshow(S.money));
  var sum=0;
  for(var q=recent.length-1;q>=0;q--){if(recent[q].t<T-60){recent.splice(0,q+1);break}}
  recent.forEach(function(e){sum+=e.a});
  setT($("#ips"),mshow(sum)+" / min"+(S.debt>0?"  ·  Debt "+mshow(S.debt):""));
  setT($("#stage"),EXPS[S.exp].n);
  setT($("#starsTop"),"Reputation "+repLevel());
  var m=mi();
  setT($("#sMenu"),String(m.list.length));
  setT($("#sTeam"),String(W.length));
  setT($("#sStyle"),m.bn>=3?m.bf+" ×"+String(m.spec):"—");

  /* satisfaction and news */
  var sv=Math.round(S.sat);
  setT($("#satv"),satWord(sv)+" "+sv+"%");
  $("#satfill").style.width=clamp(S.sat,0,100)+"%";
  setC($("#satfill"),sv>=65?"hi":sv<35?"lo":"");
  var evs=S.mkt.ev,ne=$("#news");
  var gdn=gDay(),calMk=eventsOn(gdn).filter(function(e){return e.mk});
  if(evs.length){
    var last=evs[evs.length-1];
    setT(ne,(last.f>1?"↑ ":"↓ ")+last.h);
    setC(ne,"news "+(last.f>1?"up":"down"));
  }else if(calMk.length){
    setT(ne,(calMk[0].mk.f>1?"↑ ":"↓ ")+calMk[0].n+": "+calMk[0].mk.h);
    setC(ne,"news "+(calMk[0].mk.f>1?"up":"down"));
  }else{setT(ne,"Markets are calm.");setC(ne,"news")}

  /* clock */
  var nc=nextChange(),cs2=$("#clockS");
  setT($("#clockT"),"Year "+dateOf(gdn).year+" · "+dstr(gdn)+" · "+hstr(gHour()));
  setT(cs2,nc.at?(nc.open?"Open until ":"Closed until ")+nc.at:(nc.open?"Open":"Closed"));
  setC(cs2,nc.open?"open":"shut");
  var tev=eventsOn(gdn),tl="";
  if(tev.length)tl="Today: "+tev.map(function(e){return e.n}).join(", ")+" · "+fxText(tev[0]);
  else{var tmw=eventsOn(gdn+1).filter(function(e){return e.k===0});tl=tmw.length?"Tomorrow: "+tmw.map(function(e){return e.n}).join(", "):""}
  setT($("#today"),tl);

  var hb=$("#hh");
  if(now<S.hhUntil){setT(hb,"Happy hour: "+Math.ceil((S.hhUntil-now)/1000)+" s");hb.disabled=true;setC(hb,"ghost on")}
  else if(now<S.hhReady){setT(hb,"Happy hour in "+Math.ceil((S.hhReady-now)/1000)+" s");hb.disabled=true;setC(hb,"ghost")}
  else{setT(hb,"Happy hour ×2");hb.disabled=false;setC(hb,"ghost")}

  updateOrders(W);

  /* market panel */
  var mlist=[];
  calMk.forEach(function(c){mlist.push({f:c.mk.f,t:c.n+": "+c.mk.h+" (today)"})});
  evs.forEach(function(ev){mlist.push({f:ev.f,t:ev.h+" ("+Math.ceil(ev.left)+" s)"})});
  for(var e=0;e<5;e++){
    var ln=ref.mk.ev[e],ev=mlist[e];
    if(ev){ln.style.display="";setT(ln,(ev.f>1?"↑ ":"↓ ")+ev.t);setC(ln,"gnote "+(ev.f>1?"up":"down"))}
    else if(e===0){ln.style.display="";setT(ln,"Markets are calm. Small price swings still happen.");setC(ln,"gnote")}
    else ln.style.display="none";
  }
  var hasCtl=(S.staff.controller||0)>0;
  for(var z=0;z<4;z++){
    var nl=ref.mk.notes[z];
    if(!hasCtl){nl.style.display="none";continue}
    nl.style.display="";
    setT(nl,S.notes[z]?"Controller: "+S.notes[z]:(z===0?"Controller: watching the market.":""));
    if(!S.notes[z]&&z>0)nl.style.display="none";
  }

  /* stock */
  var chef=chefActive();
  GROUPS.forEach(function(gr){
    var t=gr[0],cfg=TIERS[t],gn=ref.grp[t];
    if(t==="R"){setT(gn,chef?"Raw produce the prep chef buys in bulk and turns into prepared items.":"Hire a prep chef to buy fresh produce in bulk and prepare syrup and juices.");return}
    if(!cfg){setT(gn,t==="4"?"Each one needs trained staff, reputation and a one-time fee.":"Pay once to open a supplier account.");return}
    var tot=picksTotal(t),left=picksLeft(t),lv=S.train[cfg.staff]||0;
    gn._show=tot>=1||ING.some(function(x){return x.g===t&&has(x.id)});
    setT(gn,tot===0?"Hire your first "+STAFFM[cfg.staff].n.toLowerCase()+" to earn your first picks and reveal these ingredients.":"Picks left: "+left+" of "+tot+(left>0?". Choose with your recipes in mind.":(lv<TRAIN_COST.length?". Train your "+STAFFM[cfg.staff].pl+" in the Upgrades tab for "+cfg.per+" more.":". That is every pick for this group.")));
  });
  var clerks=S.staff.clerk||0,clerkUnlocked=!!S.upg.clerk,cp=cap();
  ING.forEach(function(x){
    var r=ref.ing[x.id],cfg=TIERS[x.g];
    if(x.raw){
      var showRaw=chef;
      r.row.style.display=showRaw?"":"none";
      if(!showRaw)return;
      var rs=S.stock[x.id]||0;
      setT(r.nm,x.n+" (raw)");
      setT(r.sub,"Stock "+Math.floor(rs)+" / "+(cp*2)+". The chef buys in bulk at "+eur(x.u*mkt(x.id)*0.7*disc())+" each.");
      r.barWrap.style.display="";r.bar.style.width=Math.min(100,rs/(cp*2)*100)+"%";
      r.btn.style.display="none";r.tog.style.display="none";setC(r.row,"row");
      return;
    }
    r.btn.style.display="";
    r.row.style.display=(!cfg||ref.grp[x.g]._show||has(x.id))?"":"none";
    if(has(x.id)){
      var st=S.stock[x.id]||0,uc=unitCost(x,0),units=Math.min(10,cp-st),cost=units*uc;
      var pct=Math.round((mkt(x.id)-1)*100);
      var trend=Math.abs(pct)>=3?(pct>0?"  ↑ "+pct+"%":"  ↓ "+(-pct)+"%"):"";
      setT(r.nm,x.q?tierName(x,0)+(x.id==="beer"||x.id==="wine"?"":""):x.n);
      var made=x.pre&&chef?" The chef makes it for "+eur(effUnit(x,0))+".":"";
      setT(r.sub,"Stock "+st+" / "+cp+". "+eur(uc)+" each"+(x.pre?" ready-made":"")+"."+trend+made+(S.auto[x.id]&&clerks>0&&!(x.pre&&chef)?" Keeps "+parOf(x.id)+".":""));
      r.barWrap.style.display="";r.bar.style.width=(st/cp*100)+"%";
      if(units<=0){setT(r.btn,"Full");r.btn.disabled=true}
      else{setT(r.btn,"+"+units+"  "+eur(cost));r.btn.disabled=S.money<cost}
      setC(r.btn,"buy");setC(r.row,"row");
      if(x.pre&&chef){r.tog.style.display=clerkUnlocked?"":"none";setT(r.tog,"Made by the prep chef")}
      else{
        r.tog.style.display=clerkUnlocked?"":"none";
        setT(r.tog,S.auto[x.id]?"Watched by a clerk (tap to free)":(clerkCap()>0?"Assign a clerk slot ("+assignedCount()+"/"+clerkCap()+" busy)":"No clerk hired"));
      }
      if(x.q){
        var ql=S.ql[x.id]||0;
        r.bt.style.display=ql>0?"":"none";
        setT(r.bt,"Cocktails use: "+tierName(x,brandOf(x.id)).toLowerCase()+" (tap to change)");
        for(var t=1;t<3;t++){
          var tr=r.tiers[t];
          tr.row.style.display="";
          setT(tr.nm,tierName(x,t));
          if(ql>=t){
            var s2=S.stock[skey(x.id,t)]||0,u2=unitCost(x,t),n2=Math.min(10,cp-s2);
            setT(tr.sub,"Stock "+s2+" / "+cp+". "+eur(u2)+" each. Sold neat for "+eur(priceOf(ITM["s_"+x.id+"_"+t]))+".");
            tr.barWrap.style.display="";tr.bar.style.width=(s2/cp*100)+"%";
            if(n2<=0){setT(tr.btn,"Full");tr.btn.disabled=true}
            else{setT(tr.btn,"+"+n2+"  "+eur(n2*u2));tr.btn.disabled=S.money<n2*u2}
            setC(tr.btn,"buy");setC(tr.row,"row cl");
          }else{
            var lk=tierLock(x,t),fee=Math.round(QFEE[t]*x.u[0]);
            tr.barWrap.style.display="none";
            if(lk){setT(tr.btn,"Locked");tr.btn.disabled=true;setT(tr.sub,lk);setC(tr.row,"row cl locked")}
            else{setT(tr.btn,"Unlock "+eur(fee));tr.btn.disabled=S.money<fee;setT(tr.sub,"A better brand for cocktails and for neat serves. Customers who can afford it will ask for it.");setC(tr.row,"row cl")}

      else{setT(r.btn,fee0?"Unlock "+eur(fee0):"Unlock");r.btn.disabled=S.money<fee0;setC(r.btn,"buy");setT(r.sub,hint(x)+(cfg?" Uses 1 pick.":""));setC(r.row,"row")}
    }

  /* finances and team */
  var dc=dailyCost(),mo=S.month,left=28-(gDay()%28);

  }else setT(ref.mood.drv,"Wages, raises and promotions will move this bar once you hire.");

  ROLES.forEach(function(x){
    var r=ref.staff[x.id],n=S.staff[x.id]||0,unl=roleUnlocked(x.id);
    setT(r.cnt,n?"×"+n:"");
    if(!unl){
      setT(r.sub,"Unlock it in the Upgrades tree first.");

}

/* ---------- loop ---------- */
var lastT=Date.now(),lastSave=Date.now();
function loop(){
  var now=Date.now(),dt=(now-lastT)/1000;lastT=now;
  if(S.kits){
    if(dt>5){
      var res=simulate(Math.min(dt,offlineCap()));
      if(res.earned>=1)toast("While you were away, the bar earned "+mshow(res.earned));
    }else tick(dt,false);
  }
  checkUnlocks();
  if(S.notice)showNotice();else if(S.inc)showIncident();
  update();
  emit("render");
  if(now-lastSave>5000){lastSave=now;save()}
}

  sr.textContent="\u2605".repeat(stars)+"\u2606".repeat(5-stars);pg.appendChild(sr);
  pg.appendChild(el("p",null,gd?"The Bar Guide rated you at the end of last month. Each star brings 3% more guests, richer guests and more critics.":"Your first rating arrives at the end of this month. Until then you are at 2 stars."));
  var comp=gd?gd.comp:guideCalc().comp;
  [["sat","Guest satisfaction"],["price","Fair prices"],["menu","Menu variety"],["rep","Reputation"],["style","Style and decor"]].forEach(function(r){vBar(pg,r[1],comp[r[0]])});
  var TIP={sat:"Faster service and friendlier staff lift satisfaction.",price:"Prices close to the fair price score best.",menu:"Unlock more ingredients to widen the menu.",rep:"Reputation grows with good months and happy guests.",style:"Decor and a theme add style points."};
  var low=null,lv=2;for(var k in comp){if(comp[k]<lv){lv=comp[k];low=k}}
  if(low)pg.appendChild(el("p","note","Weakest area: "+TIP[low]));
}
function vRegs(pg){
  pg.appendChild(el("p",null,"Regulars are guests who keep coming back for their favourite drink. A strong bond means bigger tips and more rounds. Happy guests can become regulars. Room for "+regCap()+" at this venue."));
  var a=S.reg||[];
  if(!a.length){pg.appendChild(el("p","note","Nobody yet. Serve guests well and friendly staff will win some over."));return}
  a.forEach(function(r){
    var box=el("div","cand");
    box.appendChild(el("b",null,"\u2665 "+r.name+" \u00b7 "+r.type));
    box.appendChild(el("span",null,"Favourite: "+(ITM[r.fav]?ITM[r.fav].n:"anything")+" \u00b7 "+r.visits+" visit"+(r.visits===1?"":"s")+" \u00b7 bond "+Math.round(r.bond)+"%"));
    var bar=el("div","pxbr"),fi=el("i");fi.style.width=r.bond+"%";bar.appendChild(fi);box.appendChild(bar);
    pg.appendChild(box);
  });
}
function vStyle(pg){
  var d=S.deco||{items:{}};
  pg.appendChild(el("p",null,"Style points: "+stylePts()+" of 11. Each one makes guests a little happier and the bar a little busier. A theme attracts certain guests."));
  pg.appendChild(el("div","h","Theme"));
  Object.keys(THEMES).forEach(function(id){
    var t=THEMES[id],box=el("div","cand"),on=d.theme===id;
    box.appendChild(el("b",null,t.n+(on?" \u2713":"")));box.appendChild(el("span",null,t.d));
    if(!on){var c=themeCost(),b=el("button","buy sm",c?"Switch "+money0(c):"Choose");b.disabled=S.money<c;b.onclick=function(){if(setTheme(id)){sfx("buy");openVenue("style")}};box.appendChild(b)}
    pg.appendChild(box);
  });
  pg.appendChild(el("div","h","Decor"));
  DECOR.forEach(function(it){
    var box=el("div","cand"),own=!!d.items[it.id];
    box.appendChild(el("b",null,it.n+(own?" \u2713":"")));box.appendChild(el("span",null,"+"+it.pts+" style point"+(it.pts>1?"s":"")+(it.id==="neon"?" \u00b7 shows your theme":"")));
    if(!own){var c=decorCost(it),b=el("button","buy sm","Buy "+money0(c));b.disabled=S.money<c;b.onclick=function(){if(buyDecor(it.id)){sfx("buy");openVenue("style")}};box.appendChild(b)}
    pg.appendChild(box);
  });
}
function vNights(pg){
  pg.appendChild(el("p",null,"Book a themed night to pull a crowd in the evening. You pay when you book. The calendar and the weather still apply."));
  var d0=gDay(),hr=gHour();
  for(var i=0;i<7;i++){
    (function(day){
      var dt=dateOf(day),box=el("div","cand"),wx=weatherOf(day);
      box.appendChild(el("b",null,DAYN[day%7]+" "+dt.d+" "+MN[dt.m]+(day===d0?" (today)":"")));
      box.appendChild(el("span",null,WXN[wx]+" \u00b7 "+SEASONN[seasonOf(day)]));
      var booked=S.nights&&S.nights[day];
      if(booked){box.appendChild(el("span",null,"Booked: "+NIGHTS[booked].n))}
      else if(day===d0&&hr>=17){box.appendChild(el("span",null,"Too late to book tonight."))}
      else{
        var row=el("div","vrow");
        Object.keys(NIGHTS).forEach(function(t){
          var c=nightCost(t),b=el("button","buy sm",NIGHTS[t].n.split(" ")[0]+" "+eur(c));b.disabled=S.money<c;
          b.onclick=function(){if(bookNight(day,t)){sfx("buy");openVenue("nights")}};row.appendChild(b);
        });
        box.appendChild(row);
      }
      pg.appendChild(box);
    })(d0+i);
  }
}
function vSup(pg){
  pg.appendChild(el("p",null,"Choose how you buy your ingredients. Your clerks' negotiation still lowers the price on top."));
  Object.keys(SUPS).forEach(function(id){
    var s2=SUPS[id],box=el("div","cand"),on=supMode()===id;
    box.appendChild(el("b",null,s2.n+(on?" \u2713":"")));box.appendChild(el("span",null,s2.d));
    if(id==="volume")box.appendChild(el("span",null,"Commitment: "+money0(volCommit())+" of purchases a month."));
    if(on&&id==="contract")box.appendChild(el("span",null,Math.max(0,S.sup.until-gDay())+" days left."));
    if(!on){var locked=supMode()==="contract"&&gDay()<S.sup.until,b=el("button","buy sm",locked?"Locked until the contract ends":"Switch");b.disabled=locked;b.onclick=function(){if(supSet(id)){sfx("buy");openVenue("sup")}};box.appendChild(b)}
    pg.appendChild(box);
  });
}
function vLegacy(pg){
  var L=S.leg||{pts:0,perks:{}};
  pg.appendChild(el("p",null,["Legacy points: ",el("b",null,L.pts)," \u00b7 bars retired: "+(S.legacy||0)+"."]));
  pg.appendChild(el("div","h","Branches"));
  if(S.exp<4)pg.appendChild(el("p","note","Branches open once you run the global chain. Each branch needs a brand ambassador and pays a share of a chain's profit every month."));
  else pg.appendChild(el("p","note","Active branches: "+branchActive()+" of "+(S.br||[]).length+" open (each needs its own brand ambassador). Income last month: "+money0((S.lastMonth&&S.lastMonth.branch)||0)+"."));
  CITIES.forEach(function(c){
    var box=el("div","cand"),open=(S.br||[]).indexOf(c.id)>=0;
    box.appendChild(el("b",null,c.n+(open?" \u2713":"")));
    box.appendChild(el("span",null,open?"Open. Pays about "+money0(0.3*HQP*c.k*(0.7+0.06*guideStars()))+" a month with an ambassador.":"Opening costs "+money0(c.cost)+"."));
    if(!open){var b=el("button","buy sm","Open branch");b.disabled=S.exp<4||S.money<c.cost;b.onclick=function(){if(openBranch(c.id)){sfx("new");openVenue("legacy")}};box.appendChild(b)}
    pg.appendChild(box);
  });
  pg.appendChild(el("div","h","Retire and restart"));
  pg.appendChild(el("p",null,["Hand the keys to the next generation. You start again at the lemonade stand, but your reputation perks stay, and you earn legacy points to spend on permanent bonuses. You would earn ",el("b",null,legacyPoints())," points now."]));
  var rb=el("button","buy","Retire and restart");rb.disabled=!canRetire();
  if(!canRetire())pg.appendChild(el("p","note","Available at the global chain once you have earned at least $3,000,000 in total."));
  rb.onclick=function(){
    var c=el("div","card");c.appendChild(el("h2",null,"Retire for good?"));
    c.appendChild(el("p",null,"Your bar, team, stock and money are gone. You keep reputation perks, legacy points ("+legacyPoints()+" new) and any permanent bonuses."));
    var yes=el("button","buy","Yes, retire"),no=el("button","link","Not yet");
    yes.onclick=function(){retire();location.reload()};no.onclick=function(){openVenue("legacy")};
    c.appendChild(yes);c.appendChild(no);showOv(c);
  };
  pg.appendChild(rb);
  pg.appendChild(el("div","h","Legacy bonuses"));
  LEGP.forEach(function(p){
    var l=legLvl(p.id),box=el("div","cand");
    box.appendChild(el("b",null,p.n+" \u00b7 level "+l+" of "+p.max));box.appendChild(el("span",null,p.d));
    if(l<p.max){var b=el("button","buy sm","Buy for "+p.cost[l]+" points");b.disabled=L.pts<p.cost[l];b.onclick=function(){if(buyLeg(p.id)){sfx("buy");openVenue("legacy")}};box.appendChild(b)}
    pg.appendChild(box);
  });
}
function openVenue(page){
  if(page)VPAGE=page;
  var card=el("div","card vh");card.appendChild(el("h2",null,"Venue"));
  var tabs=el("div","vtabs");
  [["guide","Guide"],["regs","Regulars"],["style","Style"],["nights","Nights"],["sup","Suppliers"],["legacy","Legacy"]].forEach(function(t){
    var b=el("button","ghost"+(VPAGE===t[0]?" on":""),t[1]);b.onclick=function(){openVenue(t[0])};tabs.appendChild(b);
  });
  card.appendChild(tabs);
  var pg=el("div","vpage");card.appendChild(pg);
  ({guide:vGuide,regs:vRegs,style:vStyle,nights:vNights,sup:vSup,legacy:vLegacy})[VPAGE](pg);
  var cl=el("button","link","Close");cl.onclick=hideOv;card.appendChild(cl);
  showOv(card);updVenBtn();
}
document.getElementById("pxven").addEventListener("click",function(){openVenue()});
function updVenBtn(){
  var b=document.getElementById("pxven"),show=(S.served>=15||S.mcount>=1);
  b.hidden=!show;if(!show)return;
  var t="Venue"+(guideStars()?" "+guideStars()+"\u2605":"");
  if(b._t!==t){b._t=t;b.textContent=t}
}
/* ---- refresh: this layer redraws on events, with no timers of its own ----
   menu (ingredients changed)        -> new-recipe banner, stock groups
   stage (venue changed)             -> expansion preview
   a panel gains or loses elements   -> row icons, folded sections (MutationObserver)
   tab (tab switched)                -> refresh the live values now
   render (app loop, after update()) -> runs what is due; values that change all the time
                                        (money, bills, timers, prices) refresh every 500 ms,
                                        the team dashboard and the trees only while their tab is open */
var DUE={},liveAt=0,errs={};
var JOBS={recipes:watchRecipes,stock:groupStock,expansion:updExpPrev,panels:function(){decorate();applyFolds()}};
function panelOn(id){var p=document.getElementById("p-"+id);return !!p&&p.classList.contains("on")}
function live(){
  updTabs();misTick();updBankBtn();updVenBtn();clampNotes();
  if(panelOn("staff"))updDash();
  if(panelOn("upg"))updTrees();
}
function safely(name,fn){try{fn()}catch(e){if(!errs[name]){errs[name]=1;if(window.console)console.error("ui refresh "+name+":",e)}}}
function structural(rs){
  for(var i=0;i<rs.length;i++){var ns=[].concat([].slice.call(rs[i].addedNodes),[].slice.call(rs[i].removedNodes));
    for(var j=0;j<ns.length;j++)if(ns[j].nodeType===1)return true}
  return false;
}
var panelObs=new MutationObserver(function(rs){if(structural(rs))DUE.panels=1});
document.querySelectorAll(".panel").forEach(function(p){panelObs.observe(p,{childList:true,subtree:true})});
onEv("menu",function(){DUE.recipes=1;DUE.stock=1});
onEv("stage",function(){DUE.expansion=1});
onEv("tab",function(){liveAt=0});
onEv("render",function(){
  if(structural(panelObs.takeRecords()))DUE.panels=1;   /* changes update() just made */
  var t=Date.now();
  if(t-liveAt>=500){liveAt=t;safely("live",live)}
  for(var k in DUE){delete DUE[k];safely(k,JOBS[k])}
  panelObs.takeRecords();                              /* our own edits are not news */
});
for(var k0 in JOBS)safely(k0,JOBS[k0]);
safely("live",live);

requestAnimationFrame(frame);
})();

setInterval(loop,100);
document.addEventListener("visibilitychange",function(){if(document.hidden)save()});
window.addEventListener("pagehide",save);
window.addEventListener("resize",drawAll);
})();

</script>
